spring.application.name=analyticore-java-service

server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/analyticore}
spring.datasource.username=${DATABASE_USERNAME:analyticore_user}
spring.datasource.password=${DATABASE_PASSWORD:}

# HikariCP
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Respuestas JSON
spring.jackson.serialization.indent-output=true

# Errores HTTP
server.error.include-message=never
server.error.include-stacktrace=never