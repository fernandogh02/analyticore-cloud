name: Java CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "java-service/**"
      - "database/init.sql"
      - ".github/workflows/java-ci-cd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "java-service/**"
      - "database/init.sql"
      - ".github/workflows/java-ci-cd.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/analyticore-java

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-security-and-unit-tests:
    name: Calidad, seguridad y pruebas unitarias Java
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    defaults:
      run:
        working-directory: java-service

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java-service/pom.xml

      - name: Ejecutar pruebas unitarias
        run: mvn -B clean test -Dtest='!*IntegrationTest'

      - name: Ejecutar SpotBugs
        run: mvn -B spotbugs:check

      - name: Obtener fecha para caché OWASP
        id: owasp-cache-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restaurar caché de Dependency-Check
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ steps.owasp-cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Verificar clave NVD
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::El secreto NVD_API_KEY no está configurado."
            exit 1
          fi

          echo "La clave NVD está disponible y protegida."

      - name: Actualizar base de vulnerabilidades
        run: |
          for attempt in 1 2 3; do
            echo "Intento $attempt de 3 para actualizar la base NVD."

            if mvn -B dependency-check:update-only \
              -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
              -DnvdApiDelay=5000 \
              -DnvdMaxRetryCount=20 \
              -DnvdValidForHours=24; then
              echo "Base NVD actualizada correctamente."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::No fue posible actualizar la base NVD después de 3 intentos."
              exit 1
            fi

            wait_seconds=$((attempt * 60))
            echo "NVD no respondió. Nuevo intento en $wait_seconds segundos."
            sleep "$wait_seconds"
          done

      - name: Analizar vulnerabilidades
        run: |
          mvn -B dependency-check:check \
            -DautoUpdate=false \
            -DossIndexAnalyzerEnabled=false

      - name: Guardar reporte de vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-dependency-check-report
          path: java-service/target/dependency-check-report.html
          if-no-files-found: ignore

  integration-tests:
    name: Pruebas de integración Java con PostgreSQL
    runs-on: ubuntu-latest
    needs: quality-security-and-unit-tests

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: analyticore_test
          POSTGRES_USER: analyticore
          POSTGRES_PASSWORD: analyticore

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U analyticore -d analyticore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/analyticore_test
      DATABASE_USERNAME: analyticore
      DATABASE_PASSWORD: analyticore
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

    defaults:
      run:
        working-directory: java-service

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java-service/pom.xml

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Inicializar base de datos
        env:
          PGPASSWORD: analyticore
        run: |
          psql \
            --host=localhost \
            --port=5432 \
            --username=analyticore \
            --dbname=analyticore_test \
            --set=ON_ERROR_STOP=1 \
            --file=../database/init.sql

      - name: Ejecutar pruebas de integración
        run: mvn -B test -Dtest='*IntegrationTest'

  docker-build-scan-and-publish:
    name: Construcción, seguridad y publicación de Java
    runs-on: ubuntu-latest
    needs:
      - quality-security-and-unit-tests
      - integration-tests

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: ./java-service
          file: ./java-service/Dockerfile
          push: false
          load: true
          pull: true
          provenance: false
          sbom: false
          tags: |
            analyticore-java:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Analizar imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: analyticore-java:${{ github.sha }}
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Iniciar sesión en GHCR
        if: >
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen versionada en GHCR
        if: >
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker push "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:staging"

  deploy-staging:
    name: Desplegar y verificar Java en staging
    runs-on: ubuntu-latest
    needs: docker-build-scan-and-publish
    timeout-minutes: 20

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Validar configuración de staging
        shell: bash
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_JAVA_STAGING_DEPLOY_HOOK }}
          JAVA_URL: ${{ vars.JAVA_STAGING_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::No está configurado RENDER_JAVA_STAGING_DEPLOY_HOOK."
            exit 1
          fi

          if [ -z "$JAVA_URL" ]; then
            echo "::error::No está configurado JAVA_STAGING_URL."
            exit 1
          fi

          echo "Configuración de Java staging disponible."

      - name: Solicitar despliegue en Render
        shell: bash
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_JAVA_STAGING_DEPLOY_HOOK }}
        run: |
          separator="?"

          if [[ "$DEPLOY_HOOK" == *"?"* ]]; then
            separator="&"
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --request POST \
            "${DEPLOY_HOOK}${separator}ref=${GITHUB_SHA}"

          echo
          echo "Render aceptó el despliegue del commit ${GITHUB_SHA}."

      - name: Esperar inicio del despliegue
        run: sleep 60

      - name: Verificar salud de Java staging
        shell: bash
        env:
          JAVA_URL: ${{ vars.JAVA_STAGING_URL }}
        run: |
          for attempt in {1..30}; do
            echo "Verificación $attempt de 30 para Java staging."

            status_code="$(
              curl \
                --location \
                --silent \
                --output /tmp/java-health.json \
                --write-out "%{http_code}" \
                --max-time 30 \
                "${JAVA_URL}/health" || true
            )"

            if [ "$status_code" = "200" ]; then
              echo "Java staging disponible con HTTP 200."
              cat /tmp/java-health.json
              echo
              exit 0
            fi

            echo "Respuesta actual: HTTP ${status_code:-sin respuesta}."
            sleep 15
          done

          echo "::error::Java staging no respondió correctamente."
          exit 1

      - name: Verificar conexión de Java con PostgreSQL
        shell: bash
        env:
          JAVA_URL: ${{ vars.JAVA_STAGING_URL }}
        run: |
          for attempt in {1..20}; do
            echo "Verificación $attempt de 20 para PostgreSQL staging."

            status_code="$(
              curl \
                --location \
                --silent \
                --output /tmp/java-database-health.json \
                --write-out "%{http_code}" \
                --max-time 30 \
                "${JAVA_URL}/health/database" || true
            )"

            if [ "$status_code" = "200" ]; then
              echo "Java se conectó correctamente con PostgreSQL staging."
              cat /tmp/java-database-health.json
              echo
              exit 0
            fi

            echo "Respuesta actual: HTTP ${status_code:-sin respuesta}."
            sleep 15
          done

          echo "::error::La conexión de Java con PostgreSQL staging falló."
          exit 1