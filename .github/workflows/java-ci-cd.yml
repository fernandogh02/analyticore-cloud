name: Java CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "java-service/**"
      - "database/init.sql"
      - ".github/workflows/java-ci-cd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "java-service/**"
      - "database/init.sql"
      - ".github/workflows/java-ci-cd.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-security-and-unit-tests:
    name: Calidad, seguridad y pruebas unitarias Java
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    defaults:
      run:
        working-directory: java-service

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java-service/pom.xml

      - name: Ejecutar pruebas unitarias
        run: mvn -B clean test -Dtest='!*IntegrationTest'

      - name: Ejecutar SpotBugs
        run: mvn -B spotbugs:check

      - name: Obtener fecha para caché OWASP
        id: owasp-cache-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restaurar caché de Dependency-Check
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ steps.owasp-cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Verificar clave NVD
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::El secreto NVD_API_KEY no está configurado."
            exit 1
          fi

          echo "La clave NVD está disponible y protegida."

      - name: Actualizar base de vulnerabilidades
        run: |
          for attempt in 1 2 3; do
            echo "Intento $attempt de 3 para actualizar la base NVD."

            if mvn -B dependency-check:update-only \
              -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
              -DnvdApiDelay=5000 \
              -DnvdMaxRetryCount=20 \
              -DnvdValidForHours=24; then
              echo "Base NVD actualizada correctamente."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "::error::No fue posible actualizar la base NVD después de 3 intentos."
              exit 1
            fi

            wait_seconds=$((attempt * 60))
            echo "NVD no respondió. Nuevo intento en $wait_seconds segundos."
            sleep "$wait_seconds"
          done

      - name: Analizar vulnerabilidades
        run: |
          mvn -B dependency-check:check \
            -DautoUpdate=false \
            -DossIndexAnalyzerEnabled=false

      - name: Guardar reporte de vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-dependency-check-report
          path: java-service/target/dependency-check-report.html
          if-no-files-found: ignore

  integration-tests:
    name: Pruebas de integración Java con PostgreSQL
    runs-on: ubuntu-latest
    needs: quality-security-and-unit-tests

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: analyticore_test
          POSTGRES_USER: analyticore
          POSTGRES_PASSWORD: analyticore

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U analyticore -d analyticore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/analyticore_test
      DATABASE_USERNAME: analyticore
      DATABASE_PASSWORD: analyticore
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

    defaults:
      run:
        working-directory: java-service

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java-service/pom.xml

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Inicializar base de datos
        env:
          PGPASSWORD: analyticore
        run: |
          psql \
            --host=localhost \
            --port=5432 \
            --username=analyticore \
            --dbname=analyticore_test \
            --set=ON_ERROR_STOP=1 \
            --file=../database/init.sql

      - name: Ejecutar pruebas de integración
        run: mvn -B test -Dtest='*IntegrationTest'
