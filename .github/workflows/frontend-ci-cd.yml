name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/analyticore-frontend

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Calidad y pruebas del frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Compilar aplicación
        run: npm run build

  docker-build-scan-and-publish:
    name: Construcción, seguridad y publicación del frontend
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          pull: true
          provenance: false
          sbom: false
          tags: |
            analyticore-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          build-args: |
            VITE_API_BASE_URL=${{ vars.FRONTEND_STAGING_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Analizar imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: analyticore-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Iniciar sesión en GHCR
        if: >
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen versionada en GHCR
        if: >
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker push "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:staging"

  deploy-staging:
    name: Desplegar y verificar frontend en staging
    runs-on: ubuntu-latest
    needs: docker-build-scan-and-publish

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Validar configuración de staging
        shell: bash
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_STAGING_DEPLOY_HOOK }}
          FRONTEND_URL: ${{ vars.FRONTEND_STAGING_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::No está configurado RENDER_FRONTEND_STAGING_DEPLOY_HOOK."
            exit 1
          fi

          if [ -z "$FRONTEND_URL" ]; then
            echo "::error::No está configurado FRONTEND_STAGING_URL."
            exit 1
          fi

          echo "Configuración de staging disponible."

      - name: Solicitar despliegue en Render
        shell: bash
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_STAGING_DEPLOY_HOOK }}
        run: |
          separator="?"

          if [[ "$DEPLOY_HOOK" == *"?"* ]]; then
            separator="&"
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --request POST \
            "${DEPLOY_HOOK}${separator}ref=${GITHUB_SHA}"

          echo
          echo "Render aceptó el despliegue del commit ${GITHUB_SHA}."

      - name: Esperar inicio del despliegue
        run: sleep 60

      - name: Verificar frontend staging
        shell: bash
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_STAGING_URL }}
        run: |
          for attempt in {1..20}; do
            echo "Verificación $attempt de 20."

            status_code="$(
              curl \
                --location \
                --silent \
                --output /tmp/frontend.html \
                --write-out "%{http_code}" \
                --max-time 30 \
                "$FRONTEND_URL" || true
            )"

            if [ "$status_code" = "200" ] &&
               [ -s /tmp/frontend.html ]; then
              echo "Frontend staging disponible con HTTP 200."
              exit 0
            fi

            echo "Respuesta actual: HTTP ${status_code:-sin respuesta}."
            sleep 15
          done

          echo "::error::El frontend staging no respondió correctamente."
          exit 1