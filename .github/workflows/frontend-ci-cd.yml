name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/analyticore-frontend

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Calidad y pruebas del frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Compilar aplicación
        run: npm run build

  docker-build-scan-and-publish:
    name: Construcción, seguridad y publicación del frontend
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          pull: true
          provenance: false
          sbom: false
          tags: |
            analyticore-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          build-args: |
            VITE_API_BASE_URL=${{ vars.FRONTEND_STAGING_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Analizar imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: analyticore-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Iniciar sesión en GHCR
        if: >
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen versionada en GHCR
        if: >
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        run: |
          docker push "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:staging"