name: Python CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "python-service/**"
      - "database/init.sql"
      - ".github/workflows/python-ci-cd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "python-service/**"
      - "database/init.sql"
      - ".github/workflows/python-ci-cd.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/analyticore-python

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-unit-tests:
    name: Calidad y pruebas unitarias de Python
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://analyticore:analyticore@localhost:5432/analyticore_test
      JAVA_SERVICE_URL: http://localhost:8080
      JAVA_REQUEST_TIMEOUT_SECONDS: "5"
      ALLOWED_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: python-service

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python-service/requirements-dev.txt

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Ejecutar Ruff
        run: python -m ruff check .

      - name: Ejecutar Bandit
        run: python -m bandit -r app

      - name: Auditar dependencias
        run: python -m pip_audit -r requirements.txt

      - name: Ejecutar pruebas unitarias
        run: python -m pytest --ignore=tests/integration

  integration-tests:
    name: Pruebas de integración con PostgreSQL
    runs-on: ubuntu-latest
    needs: quality-and-unit-tests

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: analyticore_test
          POSTGRES_USER: analyticore
          POSTGRES_PASSWORD: analyticore

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U analyticore -d analyticore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://analyticore:analyticore@localhost:5432/analyticore_test
      JAVA_SERVICE_URL: http://localhost:8080
      JAVA_REQUEST_TIMEOUT_SECONDS: "5"
      ALLOWED_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: python-service

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python-service/requirements-dev.txt

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Instalar cliente de PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Inicializar esquema de la base de datos
        env:
          PGPASSWORD: analyticore
        run: |
          psql \
            --host=localhost \
            --port=5432 \
            --username=analyticore \
            --dbname=analyticore_test \
            --set=ON_ERROR_STOP=1 \
            --file=../database/init.sql

      - name: Ejecutar pruebas de integración
        run: python -m pytest tests/integration -m integration

  docker-build-scan-and-publish:
    name: Construcción, seguridad y publicación de Python
    runs-on: ubuntu-latest
    needs:
      - quality-and-unit-tests
      - integration-tests

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: ./python-service
          file: ./python-service/Dockerfile
          push: false
          load: true
          pull: true
          provenance: false
          sbom: false
          tags: |
            analyticore-python:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extraer sistema de archivos de la imagen
        shell: bash
        run: |
          container_id="$(docker create analyticore-python:${{ github.sha }})"

          mkdir -p python-rootfs

          docker export "$container_id" |
            tar -x -C python-rootfs

          docker rm "$container_id"

      - name: Analizar imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs
          scan-ref: ./python-rootfs
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Iniciar sesión en GHCR
        if: >
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen versionada en GHCR
        if: >
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker push "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:staging"

  deploy-staging:
    name: Desplegar y verificar Python en staging
    runs-on: ubuntu-latest
    needs: docker-build-scan-and-publish

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Validar configuración de staging
        shell: bash
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PYTHON_STAGING_DEPLOY_HOOK }}
          PYTHON_URL: ${{ vars.PYTHON_STAGING_URL }}
          JAVA_URL: ${{ vars.JAVA_STAGING_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::No está configurado RENDER_PYTHON_STAGING_DEPLOY_HOOK."
            exit 1
          fi

          if [ -z "$PYTHON_URL" ]; then
            echo "::error::No está configurado PYTHON_STAGING_URL."
            exit 1
          fi

          if [ -z "$JAVA_URL" ]; then
            echo "::error::No está configurado JAVA_STAGING_URL."
            exit 1
          fi

          echo "Configuración de Python staging disponible."

      - name: Solicitar despliegue en Render
        shell: bash
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PYTHON_STAGING_DEPLOY_HOOK }}
        run: |
          separator="?"

          if [[ "$DEPLOY_HOOK" == *"?"* ]]; then
            separator="&"
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --request POST \
            "${DEPLOY_HOOK}${separator}ref=${GITHUB_SHA}"

          echo
          echo "Render aceptó el despliegue del commit ${GITHUB_SHA}."

      - name: Esperar inicio del despliegue
        run: sleep 60

      - name: Verificar salud de Python staging
        shell: bash
        env:
          PYTHON_URL: ${{ vars.PYTHON_STAGING_URL }}
        run: |
          for attempt in {1..30}; do
            echo "Verificación $attempt de 30 para Python."

            status_code="$(
              curl \
                --location \
                --silent \
                --output /tmp/python-health.json \
                --write-out "%{http_code}" \
                --max-time 30 \
                "${PYTHON_URL}/health" || true
            )"

            if [ "$status_code" = "200" ]; then
              echo "Python staging disponible con HTTP 200."
              cat /tmp/python-health.json
              echo
              exit 0
            fi

            echo "Respuesta actual: HTTP ${status_code:-sin respuesta}."
            sleep 15
          done

          echo "::error::Python staging no respondió correctamente."
          exit 1

      - name: Verificar conexión de Python con PostgreSQL
        shell: bash
        env:
          PYTHON_URL: ${{ vars.PYTHON_STAGING_URL }}
        run: |
          for attempt in {1..20}; do
            echo "Verificación $attempt de 20 para PostgreSQL."

            status_code="$(
              curl \
                --location \
                --silent \
                --output /tmp/database-health.json \
                --write-out "%{http_code}" \
                --max-time 30 \
                "${PYTHON_URL}/health/database" || true
            )"

            if [ "$status_code" = "200" ]; then
              echo "Python se conectó correctamente con PostgreSQL staging."
              cat /tmp/database-health.json
              echo
              exit 0
            fi

            echo "Respuesta actual: HTTP ${status_code:-sin respuesta}."
            sleep 15
          done

          echo "::error::La conexión de Python con PostgreSQL staging falló."
          exit 1

      - name: Activar y verificar Java staging
        shell: bash
        env:
          JAVA_URL: ${{ vars.JAVA_STAGING_URL }}
        run: |
          for attempt in {1..30}; do
            echo "Verificación $attempt de 30 para Java."

            status_code="$(
              curl \
                --location \
                --silent \
                --output /tmp/java-health.json \
                --write-out "%{http_code}" \
                --max-time 30 \
                "${JAVA_URL}/health" || true
            )"

            if [ "$status_code" = "200" ]; then
              echo "Java staging disponible con HTTP 200."
              cat /tmp/java-health.json
              echo
              exit 0
            fi

            echo "Respuesta actual: HTTP ${status_code:-sin respuesta}."
            sleep 15
          done

          echo "::error::Java staging no respondió correctamente."
          exit 1

      - name: Probar flujo completo de análisis
        shell: bash
        env:
          PYTHON_URL: ${{ vars.PYTHON_STAGING_URL }}
        run: |
          test_text="Prueba automática staging ${GITHUB_SHA}"

          create_status="$(
            curl \
              --location \
              --silent \
              --show-error \
              --output /tmp/job-created.json \
              --write-out "%{http_code}" \
              --max-time 120 \
              --request POST \
              --header "Content-Type: application/json" \
              --data "$(jq -nc --arg text "$test_text" '{text: $text}')" \
              "${PYTHON_URL}/api/jobs" || true
          )"

          echo "Respuesta de creación: HTTP ${create_status:-sin respuesta}."
          cat /tmp/job-created.json 2>/dev/null || true
          echo

          case "$create_status" in
            200|201|202)
              ;;
            *)
              echo "::error::No fue posible crear el trabajo de análisis."
              exit 1
              ;;
          esac

          job_id="$(
            jq -r \
              '.id // .jobId // .job_id // empty' \
              /tmp/job-created.json
          )"

          if [ -z "$job_id" ]; then
            echo "::error::La respuesta no contiene el identificador del trabajo."
            exit 1
          fi

          echo "Trabajo creado correctamente: $job_id"

          for attempt in {1..20}; do
            echo "Consulta $attempt de 20 para el trabajo $job_id."

            get_status="$(
              curl \
                --location \
                --silent \
                --output /tmp/job-result.json \
                --write-out "%{http_code}" \
                --max-time 30 \
                "${PYTHON_URL}/api/jobs/${job_id}" || true
            )"

            if [ "$get_status" = "200" ]; then
              job_status="$(
                jq -r \
                  '.status // .state // empty' \
                  /tmp/job-result.json |
                  tr '[:lower:]' '[:upper:]'
              )"

              echo "Estado actual: ${job_status:-sin estado}."
              cat /tmp/job-result.json
              echo

              if [ "$job_status" = "COMPLETADO" ] ||
                 [ "$job_status" = "COMPLETED" ]; then
                echo "Flujo Python, Java y PostgreSQL staging completado."
                exit 0
              fi
            else
              echo "Consulta actual: HTTP ${get_status:-sin respuesta}."
            fi

            sleep 10
          done

          echo "::error::El trabajo no llegó al estado completado."
          exit 1