name: Python CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "python-service/**"
      - "database/init.sql"
      - ".github/workflows/python-ci-cd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "python-service/**"
      - "database/init.sql"
      - ".github/workflows/python-ci-cd.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/analyticore-python

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-unit-tests:
    name: Calidad y pruebas unitarias de Python
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://analyticore:analyticore@localhost:5432/analyticore_test
      JAVA_SERVICE_URL: http://localhost:8080
      JAVA_REQUEST_TIMEOUT_SECONDS: "5"
      ALLOWED_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: python-service

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python-service/requirements-dev.txt

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Ejecutar Ruff
        run: python -m ruff check .

      - name: Ejecutar Bandit
        run: python -m bandit -r app

      - name: Auditar dependencias
        run: python -m pip_audit -r requirements.txt

      - name: Ejecutar pruebas unitarias
        run: python -m pytest --ignore=tests/integration

  integration-tests:
    name: Pruebas de integración con PostgreSQL
    runs-on: ubuntu-latest
    needs: quality-and-unit-tests

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: analyticore_test
          POSTGRES_USER: analyticore
          POSTGRES_PASSWORD: analyticore

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U analyticore -d analyticore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://analyticore:analyticore@localhost:5432/analyticore_test
      JAVA_SERVICE_URL: http://localhost:8080
      JAVA_REQUEST_TIMEOUT_SECONDS: "5"
      ALLOWED_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: python-service

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python-service/requirements-dev.txt

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Instalar cliente de PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Inicializar esquema de la base de datos
        env:
          PGPASSWORD: analyticore
        run: |
          psql \
            --host=localhost \
            --port=5432 \
            --username=analyticore \
            --dbname=analyticore_test \
            --set=ON_ERROR_STOP=1 \
            --file=../database/init.sql

      - name: Ejecutar pruebas de integración
        run: python -m pytest tests/integration -m integration

  docker-build-scan-and-publish:
    name: Construcción, seguridad y publicación de Python
    runs-on: ubuntu-latest
    needs:
      - quality-and-unit-tests
      - integration-tests

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: ./python-service
          file: ./python-service/Dockerfile
          push: false
          load: true
          pull: true
          provenance: false
          sbom: false
          tags: |
            analyticore-python:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extraer sistema de archivos de la imagen
        shell: bash
        run: |
          container_id="$(docker create analyticore-python:${{ github.sha }})"

          mkdir -p python-rootfs

          docker export "$container_id" |
            tar -x -C python-rootfs

          docker rm "$container_id"

      - name: Analizar imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: rootfs
          scan-ref: ./python-rootfs
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Iniciar sesión en GHCR
        if: >
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen versionada en GHCR
        if: >
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker push "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:staging"